services:
  - type: web
    name: samajob-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node start.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRE
        value: 7d
      - key: MAX_FILE_SIZE
        value: "5242880"
      - key: JWT_SECRET
        generateValue: true   # Render génère automatiquement un secret fort
      - key: DB_HOST
        sync: false           # À remplir : gateway01.eu-central-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        sync: false           # À remplir : 4000 (TiDB Cloud)
      - key: DB_USER
        sync: false           # À remplir : depuis TiDB Cloud
      - key: DB_PASSWORD
        sync: false           # À remplir : depuis TiDB Cloud
      - key: DB_NAME
        sync: false           # À remplir : depuis TiDB Cloud
      - key: DB_SSL
        value: "true"         # TiDB Cloud exige SSL
